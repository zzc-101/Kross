# Extra worker machine: JuiceFS mount + kross-node. Do not start postgres/server here.
# Load kross-node:local and kross-worker:local first, then:
#
#   export KROSS_CONTROL_PLANE_URL=http://控制面局域网IP:8787
#   export KROSS_NODE_TOKEN=与控制面相同
#   export KROSS_NODE_ID=node-2
#   export KROSS_POSTGRES_PASSWORD=与控制面相同
#   export KROSS_S3_SECRET_KEY=与控制面相同
#   docker compose -f docker-compose.node.yml up -d

services:
  juicefs:
    image: juicedata/mount:ce-v1.4.1
    privileged: true
    cap_add: [SYS_ADMIN]
    devices: ["/dev/fuse"]
    security_opt: [apparmor:unconfined]
    environment:
      JUICEFS_META_URL: postgres://kross:${KROSS_POSTGRES_PASSWORD:?请设置 KROSS_POSTGRES_PASSWORD}@${KROSS_JUICEFS_META_HOST:?请设置控制面主机}:5432/kross?sslmode=disable
      JUICEFS_BUCKET: http://${KROSS_JUICEFS_META_HOST}:9000/kross-jfs
      JUICEFS_ACCESS_KEY: ${KROSS_S3_ACCESS_KEY:-kross}
      JUICEFS_SECRET_KEY: ${KROSS_S3_SECRET_KEY:?请设置 KROSS_S3_SECRET_KEY}
      JUICEFS_VOLUME_NAME: kross-work
    volumes:
      - ./docker/juicefs-entrypoint.sh:/juicefs-entrypoint.sh:ro
      - type: bind
        source: ${KROSS_JUICEFS_MOUNT:-/var/lib/kross/jfs}
        target: /jfs
        bind:
          propagation: rshared
      - ${KROSS_JUICEFS_CACHE:-/var/cache/kross-jfs}:/var/jfsCache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/sh", "/juicefs-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "cat /jfs/.control >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  kross-node:
    image: kross-node:local
    environment:
      KROSS_CONTROL_PLANE_URL: ${KROSS_CONTROL_PLANE_URL:?请设置 KROSS_CONTROL_PLANE_URL}
      KROSS_NODE_TOKEN: ${KROSS_NODE_TOKEN:?请设置 KROSS_NODE_TOKEN}
      KROSS_NODE_ID: ${KROSS_NODE_ID:?请设置 KROSS_NODE_ID}
      KROSS_WORKER_STORAGE: juicefs
      KROSS_JUICEFS_MOUNT: ${KROSS_JUICEFS_MOUNT:-/var/lib/kross/jfs}
      KROSS_WORKER_IMAGE: kross-worker:local
      KROSS_ORCHESTRATOR_MANAGER_ID: ${KROSS_ORCHESTRATOR_MANAGER_ID:-kross-saas}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${KROSS_JUICEFS_MOUNT:-/var/lib/kross/jfs}:${KROSS_JUICEFS_MOUNT:-/var/lib/kross/jfs}:rshared
    depends_on:
      juicefs:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
