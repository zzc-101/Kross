services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kross
      POSTGRES_USER: kross
      POSTGRES_PASSWORD: ${KROSS_POSTGRES_PASSWORD:?请设置 KROSS_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kross -d kross"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - kross-postgres-v3:/var/lib/postgresql/data
    networks: [kross-control]
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${KROSS_S3_ACCESS_KEY:-kross}
      MINIO_ROOT_PASSWORD: ${KROSS_S3_SECRET_KEY:?请设置 KROSS_S3_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: ${KROSS_S3_CORS_ALLOW_ORIGIN:-http://localhost:8787}
    ports:
      - "${KROSS_S3_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - kross-minio-v2:/data
    networks:
      kross-control:
        aliases: [minio]
    restart: unless-stopped

  worker-image:
    image: kross-worker:local
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    command: ["true"]
    networks: [kross-control]
    restart: "no"

  server:
    image: kross-server:local
    build:
      context: .
      dockerfile: docker/control-plane.Dockerfile
    environment:
      PORT: 8787
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kross
      SPRING_DATASOURCE_USERNAME: kross
      SPRING_DATASOURCE_PASSWORD: ${KROSS_POSTGRES_PASSWORD:?请设置 KROSS_POSTGRES_PASSWORD}
      KROSS_DEV_IDENTITY: ${KROSS_DEV_IDENTITY:-0}
      KROSS_CREDENTIAL_MASTER_KEY: ${KROSS_CREDENTIAL_MASTER_KEY:?请设置 KROSS_CREDENTIAL_MASTER_KEY}
      KROSS_PUBLIC_BASE_URL: ${KROSS_PUBLIC_BASE_URL:-http://kross-server:8787}
      KROSS_SCHEDULER_OWNER: ${KROSS_SCHEDULER_OWNER:-kross-server}
      KROSS_WORKER_IMAGE: kross-worker:local
      KROSS_WORKER_STORAGE: ${KROSS_WORKER_STORAGE:-local}
      KROSS_JUICEFS_MOUNT: ${KROSS_JUICEFS_MOUNT:-}
      KROSS_WORKER_RUNTIME: ${KROSS_WORKER_RUNTIME:-local}
      KROSS_NODE_TOKEN: ${KROSS_NODE_TOKEN:-}
      KROSS_NODE_ID: ${KROSS_NODE_ID:-node-1}
      KROSS_NODE_TOKENS: ${KROSS_NODE_TOKENS:-}
      KROSS_ORCHESTRATOR_MANAGER_ID: ${KROSS_ORCHESTRATOR_MANAGER_ID:-kross-saas}
      KROSS_CONTROL_PLANE_CONTAINER: ${COMPOSE_PROJECT_NAME:-agent}-server-1
      KROSS_AGENT_NETWORK: ${COMPOSE_PROJECT_NAME:-agent}_kross-control
      KROSS_S3_CONTAINER: ${COMPOSE_PROJECT_NAME:-agent}-minio-1
      KROSS_S3_ENDPOINT: http://minio:9000
      KROSS_S3_PUBLIC_ENDPOINT: ${KROSS_S3_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
      KROSS_S3_BUCKET: ${KROSS_S3_BUCKET:-kross}
      KROSS_S3_ACCESS_KEY: ${KROSS_S3_ACCESS_KEY:-kross}
      KROSS_S3_SECRET_KEY: ${KROSS_S3_SECRET_KEY:?请设置 KROSS_S3_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      worker-image:
        condition: service_completed_successfully
    expose: ["8787"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8787/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 40s
    networks:
      kross-control:
        aliases: [kross-server]
    restart: unless-stopped

  web:
    image: kross-web:local
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${KROSS_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [kross-control]
    restart: unless-stopped

volumes:
  kross-postgres-v3:
  kross-minio-v2:

networks:
  kross-control:
    driver: bridge
