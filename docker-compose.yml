services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kross
      POSTGRES_USER: kross
      POSTGRES_PASSWORD: ${KROSS_POSTGRES_PASSWORD:?请设置 KROSS_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kross -d kross"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - kross-postgres-v2:/var/lib/postgresql/data
    networks: [kross-control]
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    command: ["node", "dist/server-migrate.mjs"]
    environment:
      DATABASE_URL: postgres://kross:${KROSS_POSTGRES_PASSWORD}@postgres:5432/kross
      KROSS_DEV_IDENTITY: ${KROSS_DEV_IDENTITY:-1}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [kross-control]
    restart: "no"

  server:
    container_name: kross-server
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    environment:
      DATABASE_URL: postgres://kross:${KROSS_POSTGRES_PASSWORD}@postgres:5432/kross
      KROSS_DEV_IDENTITY: ${KROSS_DEV_IDENTITY:-1}
      PORT: 8787
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose: ["8787"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [kross-control]
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: docker/orchestrator.Dockerfile
    environment:
      KROSS_ORCHESTRATOR_SERVICE_TOKEN: ${KROSS_ORCHESTRATOR_SERVICE_TOKEN:?请设置 KROSS_ORCHESTRATOR_SERVICE_TOKEN}
      KROSS_WORKER_IMAGE: kross-worker:local
      KROSS_ORCHESTRATOR_MANAGER_ID: ${KROSS_ORCHESTRATOR_MANAGER_ID:-kross-saas}
      KROSS_CONTROL_PLANE_CONTAINER: kross-server
      PORT: 8790
    depends_on:
      server:
        condition: service_healthy
      worker-image:
        condition: service_completed_successfully
    expose: ["8790"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [kross-control]
    restart: unless-stopped

  worker-image:
    image: kross-worker:local
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    command: ["true"]
    networks: [kross-control]
    restart: "no"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${KROSS_PORT:-8787}:8787"
    networks: [kross-control]
    restart: unless-stopped

volumes:
  kross-postgres-v2:

networks:
  kross-control:
    name: kross-control-v2
    driver: bridge
