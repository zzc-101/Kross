name: Release candidate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release candidate
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            worker/package-lock.json
          registry-url: https://registry.npmjs.org

      - working-directory: frontend
        run: npm ci
      - working-directory: worker
        run: npm ci

      - name: Validate release contract
        run: node scripts/check-version-consistency.mjs --tag "$RELEASE_TAG" --release

      - name: Verify source
        run: |
          node scripts/check-doc-links.mjs
          npm run typecheck --prefix frontend
          npm run typecheck --prefix worker
          npm test --prefix worker
          npm test --prefix frontend
          npm run api:check --prefix worker
          npm run build --prefix frontend

      - name: Resolve image tags
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('worker/package.json','utf8')).version")
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          RELEASE_COMMIT=$(git rev-parse HEAD)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_ENV"

      - name: Build versioned Worker image
        run: |
          docker build --file docker/worker.Dockerfile \
            --tag "kross-worker:$VERSION" \
            --tag "kross-worker:$SHORT_SHA" \
            --tag kross-worker:local .

      - name: Build versioned Server image
        run: |
          docker build --file docker/control-plane.Dockerfile \
            --tag "kross-server:$VERSION" \
            --tag "kross-server:$SHORT_SHA" \
            --tag kross-server:local .

      - name: Build versioned Web image
        run: |
          docker build --file docker/web.Dockerfile \
            --tag "kross-web:$VERSION" \
            --tag "kross-web:$SHORT_SHA" \
            --tag kross-web:local .

      - name: Smoke test release images
        run: ./scripts/cloud-container-smoke.sh

      - name: Record container image metadata
        run: |
          mkdir -p release
          for component in web server worker; do
            printf '%s ' "$component" >> release/container-images.txt
            docker image inspect \
              "kross-$component:$VERSION" \
              --format '{{json .RepoTags}} {{.Id}}' \
              >> release/container-images.txt
          done

      - name: Generate checksums and release metadata
        run: |
          node scripts/release-metadata.mjs \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --artifacts release

      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: kross-${{ env.VERSION }}-release-candidate
          path: release/
          if-no-files-found: error
          retention-days: 14
