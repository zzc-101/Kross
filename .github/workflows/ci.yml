name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.19.0
          - os: ubuntu-latest
            node: 24.x
          - os: macos-latest
            node: 22.19.0
          - os: windows-latest
            node: 22.19.0

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run version:check
      - run: npm run api:check
      - run: npm run protocol:check
      - run: npm run typecheck
      - run: npm test -- --run
      - if: matrix.os == 'ubuntu-latest' && matrix.node == '22.19.0'
        run: npm run eval -- --fixture
      - run: npm run docs:check
      - run: npm run build:cli
      - run: npm run build:web

  control-plane:
    name: Java control plane
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compile control plane
        working-directory: backend
        run: ./mvnw -B -DskipTests compile

  package:
    name: Package smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run package:check
      - run: npm audit --omit=dev

  cloud-containers:
    name: Cloud container build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Validate Compose configuration
        env:
          KROSS_POSTGRES_PASSWORD: ci-placeholder-password
          KROSS_CREDENTIAL_MASTER_KEY: abcdef0123456789abcdef0123456789
          KROSS_S3_SECRET_KEY: kross-minio-ci-secret
        run: docker compose config --quiet

      - name: Build worker image
        run: docker build --file docker/worker.Dockerfile --tag kross-worker:local .

      - name: Build control-plane image
        run: docker build --file docker/server.Dockerfile --tag kross-server:local .

      - name: Build web image
        run: docker build --file docker/web.Dockerfile --tag kross-web:local .

      - name: Smoke test Cloud containers
        run: ./scripts/cloud-container-smoke.sh
