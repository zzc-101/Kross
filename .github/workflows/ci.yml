name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.19.0
          - os: ubuntu-latest
            node: 24.x
          - os: macos-latest
            node: 22.19.0
          - os: windows-latest
            node: 22.19.0

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - working-directory: frontend
        run: pnpm install --frozen-lockfile
      - working-directory: frontend
        run: pnpm typecheck
      - working-directory: frontend
        run: pnpm test
      - working-directory: frontend
        run: pnpm build

  worker:
    name: Worker (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.19.0
          - os: ubuntu-latest
            node: 24.x
          - os: macos-latest
            node: 22.19.0
          - os: windows-latest
            node: 22.19.0

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - working-directory: worker
        run: pnpm install --frozen-lockfile
      - working-directory: worker
        run: pnpm typecheck
      - working-directory: worker
        run: pnpm test

  backend:
    name: Java backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compile backend
        working-directory: backend
        run: ./mvnw -B -DskipTests compile

  docs:
    name: Docs and version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
      - run: node scripts/check-version-consistency.mjs
      - run: node scripts/check-doc-links.mjs
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - run: helm template kross deploy/cluster --namespace kross >/dev/null

  cloud-containers:
    name: Cloud container build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Validate Compose configuration
        env:
          APP_POSTGRES_PASSWORD: ci-placeholder-password
          APP_CREDENTIAL_MASTER_KEY: abcdef0123456789abcdef0123456789
          APP_S3_SECRET_KEY: kross-minio-ci-secret
        run: docker compose --project-directory . -f deploy/local/docker-compose.yml config --quiet

      - name: Build worker image
        run: docker build --file deploy/local/docker/worker.Dockerfile --tag kross-worker:local .

      - name: Build backend image
        run: docker build --file deploy/local/docker/control-plane.Dockerfile --tag kross-server:local .

      - name: Build web image
        run: docker build --file deploy/local/docker/web.Dockerfile --tag kross-web:local .

      - name: Smoke test Cloud containers
        run: ./scripts/cloud-container-smoke.sh
