services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: kross
      POSTGRES_USER: kross
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:?请设置 APP_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kross -d kross"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - kross-postgres-v3:/var/lib/postgresql/data
    networks: [kross-control]
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${APP_S3_ACCESS_KEY:-kross}
      MINIO_ROOT_PASSWORD: ${APP_S3_SECRET_KEY:?请设置 APP_S3_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_S3_CORS_ALLOW_ORIGIN:-*}
    ports:
      - "${APP_S3_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - kross-minio-v2:/data
    networks:
      kross-control:
        aliases: [minio]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # 纯缓存用途：关闭持久化，Redis 丢失后由控制面回源 PostgreSQL 重建
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [kross-control]
    restart: unless-stopped

  worker-image:
    image: kross-worker:local
    build:
      context: .
      dockerfile: deploy/local/docker/worker.Dockerfile
    command: ["true"]
    networks: [kross-control]
    restart: "no"

  server:
    image: kross-server:local
    build:
      context: .
      dockerfile: deploy/local/docker/control-plane.Dockerfile
    environment:
      PORT: 8787
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kross
      SPRING_DATASOURCE_USERNAME: kross
      SPRING_DATASOURCE_PASSWORD: ${APP_POSTGRES_PASSWORD:?请设置 APP_POSTGRES_PASSWORD}
      APP_DEV_IDENTITY: ${APP_DEV_IDENTITY:-0}
      APP_CREDENTIAL_MASTER_KEY: ${APP_CREDENTIAL_MASTER_KEY:?请设置 APP_CREDENTIAL_MASTER_KEY}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://kross-server:8787}
      APP_EXTERNAL_BASE_URL: ${APP_EXTERNAL_BASE_URL:-http://localhost:8787}
      APP_SCHEDULER_OWNER: ${APP_SCHEDULER_OWNER:-kross-server}
      APP_WORKER_IMAGE: kross-worker:local
      APP_WORKER_STORAGE: ${APP_WORKER_STORAGE:-local}
      APP_JUICEFS_MOUNT: ${APP_JUICEFS_MOUNT:-}
      APP_WORKER_RUNTIME: ${APP_WORKER_RUNTIME:-local}
      APP_ORCHESTRATOR_MANAGER_ID: ${APP_ORCHESTRATOR_MANAGER_ID:-kross-saas}
      APP_CONTROL_PLANE_CONTAINER: ${COMPOSE_PROJECT_NAME:-agent}-server-1
      APP_AGENT_NETWORK: ${COMPOSE_PROJECT_NAME:-agent}_kross-control
      APP_S3_CONTAINER: ${COMPOSE_PROJECT_NAME:-agent}-minio-1
      APP_S3_ENDPOINT: http://minio:9000
      APP_S3_PUBLIC_ENDPOINT: ${APP_S3_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_CACHE_ENABLED: ${APP_CACHE_ENABLED:-true}
      APP_S3_BUCKET: ${APP_S3_BUCKET:-kross}
      APP_S3_ACCESS_KEY: ${APP_S3_ACCESS_KEY:-kross}
      APP_S3_SECRET_KEY: ${APP_S3_SECRET_KEY:?请设置 APP_S3_SECRET_KEY}
      APP_FEISHU_ENABLED: ${APP_FEISHU_ENABLED:-false}
      APP_FEISHU_APP_ID: ${APP_FEISHU_APP_ID:-}
      APP_FEISHU_APP_SECRET: ${APP_FEISHU_APP_SECRET:-}
      APP_FEISHU_VERIFICATION_TOKEN: ${APP_FEISHU_VERIFICATION_TOKEN:-}
      APP_FEISHU_ENCRYPT_KEY: ${APP_FEISHU_ENCRYPT_KEY:-}
      APP_LOG_FILE: /var/log/kross/server.log
      APP_LOG_FILE_PATTERN: /var/log/kross/server.%d{yyyy-MM-dd}.%i.log.gz
      APP_LOG_MAX_FILE_SIZE: ${APP_LOG_MAX_FILE_SIZE:-50MB}
      APP_LOG_MAX_HISTORY: ${APP_LOG_MAX_HISTORY:-14}
      APP_LOG_TOTAL_SIZE_CAP: ${APP_LOG_TOTAL_SIZE_CAP:-1GB}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker-image:
        condition: service_completed_successfully
    expose: ["8787"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APP_LOG_DIR:-./runs/logs/server}:/var/log/kross
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8787/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 40s
    networks:
      kross-control:
        aliases: [kross-server]
    restart: unless-stopped

  web:
    image: kross-web:local
    build:
      context: .
      dockerfile: deploy/local/docker/web.Dockerfile
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [kross-control]
    restart: unless-stopped

volumes:
  kross-postgres-v3:
  kross-minio-v2:

networks:
  kross-control:
    driver: bridge
