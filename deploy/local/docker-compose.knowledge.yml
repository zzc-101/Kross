services:
  knowledge:
    profiles: ["knowledge"]
    image: kross-knowledge:local
    build:
      context: knowledge
      dockerfile: Dockerfile
    environment:
      KNOWLEDGE_INTERNAL_TOKEN: ${KROSS_KNOWLEDGE_INTERNAL_TOKEN:-}
      KNOWLEDGE_DATABASE_URL: postgresql://kross:${KROSS_POSTGRES_PASSWORD}@postgres:5432/kross
      KNOWLEDGE_EMBEDDING_PROVIDER: ${KNOWLEDGE_EMBEDDING_PROVIDER:-auto}
      KNOWLEDGE_EMBEDDING_BASE_URL: ${KNOWLEDGE_EMBEDDING_BASE_URL:-}
      KNOWLEDGE_EMBEDDING_API_KEY: ${KNOWLEDGE_EMBEDDING_API_KEY:-}
      KNOWLEDGE_EMBEDDING_SIZE: ${KNOWLEDGE_EMBEDDING_SIZE:-2b}
      KNOWLEDGE_EMBEDDING_MODEL: ${KNOWLEDGE_EMBEDDING_MODEL:-}
      KNOWLEDGE_EMBEDDING_DIM: ${KNOWLEDGE_EMBEDDING_DIM:-0}
      KNOWLEDGE_EMBEDDING_MODEL_DIR: ${KNOWLEDGE_EMBEDDING_MODEL_DIR:-}
      KNOWLEDGE_EMBEDDING_HUB: ${KNOWLEDGE_EMBEDDING_HUB:-huggingface}
      KNOWLEDGE_EMBEDDING_DEVICE: ${KNOWLEDGE_EMBEDDING_DEVICE:-auto}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      kross-control:
        aliases: [knowledge]
    restart: unless-stopped

  server:
    environment:
      KROSS_KNOWLEDGE_BASE_URL: http://knowledge:8090
      KROSS_KNOWLEDGE_INTERNAL_TOKEN: ${KROSS_KNOWLEDGE_INTERNAL_TOKEN:-}
    depends_on:
      knowledge:
        condition: service_healthy
