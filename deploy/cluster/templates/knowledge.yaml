{{- if .Values.knowledge.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: knowledge
  namespace: {{ include "kross.namespace" . }}
  labels:
    {{- include "kross.labels" . | nindent 4 }}
    app.kubernetes.io/component: knowledge
spec:
  ports:
    - name: http
      port: 8090
      targetPort: 8090
  selector:
    app.kubernetes.io/component: knowledge
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge
  namespace: {{ include "kross.namespace" . }}
  labels:
    {{- include "kross.labels" . | nindent 4 }}
    app.kubernetes.io/component: knowledge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: knowledge
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "kross.labels" . | nindent 8 }}
        app.kubernetes.io/component: knowledge
    spec:
      containers:
        - name: knowledge
          image: {{ .Values.knowledge.image }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: KNOWLEDGE_INTERNAL_TOKEN
              value: {{ .Values.knowledge.internalToken | quote }}
            - name: KNOWLEDGE_DATABASE_URL
              value: {{ printf "postgresql://kross:%s@postgres:5432/kross" .Values.secrets.postgresPassword | quote }}
            - name: KNOWLEDGE_EMBEDDING_PROVIDER
              value: {{ .Values.knowledge.embeddingProvider | default "auto" | quote }}
            - name: KNOWLEDGE_EMBEDDING_BASE_URL
              value: {{ .Values.knowledge.embeddingBaseUrl | default "" | quote }}
            - name: KNOWLEDGE_EMBEDDING_API_KEY
              value: {{ .Values.knowledge.embeddingApiKey | default "" | quote }}
            - name: KNOWLEDGE_EMBEDDING_SIZE
              value: {{ .Values.knowledge.embeddingSize | default "2b" | quote }}
            - name: KNOWLEDGE_EMBEDDING_MODEL
              value: {{ .Values.knowledge.embeddingModel | default "" | quote }}
            - name: KNOWLEDGE_EMBEDDING_DIM
              value: {{ .Values.knowledge.embeddingDim | toString | quote }}
            - name: KNOWLEDGE_EMBEDDING_MODEL_DIR
              value: {{ .Values.knowledge.embeddingModelDir | default "" | quote }}
            - name: KNOWLEDGE_EMBEDDING_HUB
              value: {{ .Values.knowledge.embeddingHub | default "huggingface" | quote }}
            - name: KNOWLEDGE_EMBEDDING_DEVICE
              value: {{ .Values.knowledge.embeddingDevice | default "auto" | quote }}
          ports:
            - containerPort: 8090
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 15
            periodSeconds: 20
{{- end }}
