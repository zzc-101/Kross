apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.kross.storageClass }}
  labels:
    {{- include "kross.labels" . | nindent 4 }}
provisioner: csi.juicefs.com
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
parameters:
  csi.storage.k8s.io/provisioner-secret-name: juicefs-sc-secret
  csi.storage.k8s.io/provisioner-secret-namespace: {{ include "kross.namespace" . }}
  csi.storage.k8s.io/node-publish-secret-name: juicefs-sc-secret
  csi.storage.k8s.io/node-publish-secret-namespace: {{ include "kross.namespace" . }}
  pathPattern: "${.PVC.annotations.kross-workspace-path}"
