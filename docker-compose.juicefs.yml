# JuiceFS for cluster workspaces. Uses the official juicedata/mount image;
# the FUSE mount is published to the host at KROSS_JUICEFS_MOUNT.
#   docker compose -f docker-compose.yml -f docker-compose.juicefs.yml up -d
#
# Cluster (control plane + first node):
#   docker compose -f docker-compose.yml -f docker-compose.juicefs.yml -f docker-compose.cluster.yml up -d
#
# Docker Desktop (macOS/Windows) cannot rshared-bind /Users. Use /var/lib/kross/jfs
# (Linux VM path) and make the VM root rshared before mounting FUSE.

services:
  postgres:
    ports:
      - "5432:5432"

  vm-shared-mounts:
    image: alpine:3.20
    privileged: true
    pid: host
    restart: "no"
    command:
      - nsenter
      - -t
      - "1"
      - -m
      - --
      - sh
      - -c
      - mkdir -p /var/lib/kross/jfs /var/cache/kross-jfs; mount --make-rshared / || true

  juicefs:
    image: juicedata/mount:ce-v1.4.1
    privileged: true
    cap_add: [SYS_ADMIN]
    devices: ["/dev/fuse"]
    security_opt: [apparmor:unconfined]
    environment:
      JUICEFS_META_URL: postgres://kross:${KROSS_POSTGRES_PASSWORD:?请设置 KROSS_POSTGRES_PASSWORD}@postgres:5432/kross?sslmode=disable
      JUICEFS_BUCKET: http://minio:9000/kross-jfs
      JUICEFS_ACCESS_KEY: ${KROSS_S3_ACCESS_KEY:-kross}
      JUICEFS_SECRET_KEY: ${KROSS_S3_SECRET_KEY:?请设置 KROSS_S3_SECRET_KEY}
      JUICEFS_VOLUME_NAME: kross-work
    volumes:
      - ./docker/juicefs-entrypoint.sh:/juicefs-entrypoint.sh:ro
      - type: bind
        source: ${KROSS_JUICEFS_MOUNT:-/var/lib/kross/jfs}
        target: /jfs
        bind:
          propagation: rshared
      - ${KROSS_JUICEFS_CACHE:-/var/cache/kross-jfs}:/var/jfsCache
    entrypoint: ["/bin/sh", "/juicefs-entrypoint.sh"]
    depends_on:
      vm-shared-mounts:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "cat /jfs/.control >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks: [kross-control]
    restart: unless-stopped

  server:
    environment:
      KROSS_WORKER_STORAGE: juicefs
      KROSS_JUICEFS_MOUNT: ${KROSS_JUICEFS_MOUNT:-/var/lib/kross/jfs}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${KROSS_JUICEFS_MOUNT:-/var/lib/kross/jfs}:${KROSS_JUICEFS_MOUNT:-/var/lib/kross/jfs}:rshared
    depends_on:
      juicefs:
        condition: service_healthy
