server:
  port: ${PORT:8787}
  error:
    include-message: never
  servlet:
    session:
      timeout: 7d
      cookie:
        name: APP_SESSION
        http-only: true
        same-site: lax

spring:
  application:
    name: control-plane
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      request-timeout: -1
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/kross}
    username: ${SPRING_DATASOURCE_USERNAME:kross}
    password: ${SPRING_DATASOURCE_PASSWORD:kross}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      connect-timeout: 500ms
      timeout: 500ms

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL
  type-handlers-package: com.kross.support
  mapper-locations: classpath:mapper/*.xml

logging:
  file:
    name: ${APP_LOG_FILE:}
  structured:
    format:
      console: logstash
      file: logstash
    json:
      add:
        service: control-plane
  logback:
    rollingpolicy:
      file-name-pattern: ${APP_LOG_FILE_PATTERN:/var/log/kross/server.%d{yyyy-MM-dd}.%i.log.gz}
      max-file-size: ${APP_LOG_MAX_FILE_SIZE:50MB}
      max-history: ${APP_LOG_MAX_HISTORY:14}
      total-size-cap: ${APP_LOG_TOTAL_SIZE_CAP:1GB}
      clean-history-on-start: false

app:
  dev-identity-enabled: ${APP_DEV_IDENTITY:false}
  cache:
    enabled: ${APP_CACHE_ENABLED:true}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://127.0.0.1:8787}
  external-base-url: ${APP_EXTERNAL_BASE_URL:http://127.0.0.1:8787}
  credential-master-key: ${APP_CREDENTIAL_MASTER_KEY:}
  scheduler-owner: ${APP_SCHEDULER_OWNER:kross-server}
  worker-image: ${APP_WORKER_IMAGE:kross-worker:local}
  orchestrator-manager-id: ${APP_ORCHESTRATOR_MANAGER_ID:kross-saas}
  control-plane-container: ${APP_CONTROL_PLANE_CONTAINER:}
  object-store-container: ${APP_S3_CONTAINER:}
  agent-network: ${APP_AGENT_NETWORK:}
  worker-runtime: ${APP_WORKER_RUNTIME:local}
  worker-storage: ${APP_WORKER_STORAGE:local}
  juicefs-mount: ${APP_JUICEFS_MOUNT:}
  kubernetes:
    namespace: ${APP_KUBERNETES_NAMESPACE:}
    storage-class: ${APP_KUBERNETES_STORAGE_CLASS:kross-juicefs}
    workspace-size: ${APP_KUBERNETES_WORKSPACE_SIZE:10Gi}
  api:
    prefix: ${APP_API_PREFIX:/api/v2}
  scheduler:
    poll-ms: ${APP_SCHEDULER_POLL_MS:5000}
  agent:
    idle-ms: ${APP_AGENT_IDLE_MS:900000}
    token-ttl-ms: ${APP_AGENT_TOKEN_TTL_MS:43200000}
    heartbeat-interval-ms: ${APP_AGENT_HEARTBEAT_INTERVAL_MS:10000}
    job-lease-ms: ${APP_AGENT_JOB_LEASE_MS:90000}
    job-max-attempts: ${APP_AGENT_JOB_MAX_ATTEMPTS:2}
    start-timeout-ms: ${APP_AGENT_START_TIMEOUT_MS:120000}
    cpu-millis: ${APP_AGENT_CPU_MILLIS:2000}
    memory-bytes: ${APP_AGENT_MEMORY_BYTES:1073741824}
    max-pids: ${APP_AGENT_MAX_PIDS:512}
  knowledge:
    base-url: ${APP_KNOWLEDGE_BASE_URL:}
    internal-token: ${APP_KNOWLEDGE_INTERNAL_TOKEN:}
  feishu:
    enabled: ${APP_FEISHU_ENABLED:false}
    app-id: ${APP_FEISHU_APP_ID:}
    app-secret: ${APP_FEISHU_APP_SECRET:}
    verification-token: ${APP_FEISHU_VERIFICATION_TOKEN:}
    encrypt-key: ${APP_FEISHU_ENCRYPT_KEY:}
    base-url: ${APP_FEISHU_BASE_URL:https://open.feishu.cn}
  s3:
    endpoint: ${APP_S3_ENDPOINT:http://127.0.0.1:9000}
    public-endpoint: ${APP_S3_PUBLIC_ENDPOINT:http://127.0.0.1:9000}
    region: ${APP_S3_REGION:us-east-1}
    bucket: ${APP_S3_BUCKET:kross}
    access-key: ${APP_S3_ACCESS_KEY:kross}
    secret-key: ${APP_S3_SECRET_KEY:kross-minio-secret}
    path-style: true
    presign-ttl: PT15M
