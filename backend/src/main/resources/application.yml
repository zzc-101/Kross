server:
  port: ${PORT:8787}
  error:
    include-message: never
  servlet:
    session:
      timeout: 7d
      cookie:
        name: KROSS_SESSION
        http-only: true
        same-site: lax

spring:
  application:
    name: kross-control-plane
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      request-timeout: -1
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/kross}
    username: ${SPRING_DATASOURCE_USERNAME:kross}
    password: ${SPRING_DATASOURCE_PASSWORD:kross}
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL
  type-handlers-package: com.kross.support
  mapper-locations: classpath:mapper/*.xml

logging:
  file:
    name: ${KROSS_LOG_FILE:}
  structured:
    format:
      console: logstash
      file: logstash
    json:
      add:
        service: kross-control-plane
  logback:
    rollingpolicy:
      file-name-pattern: ${KROSS_LOG_FILE_PATTERN:/var/log/kross/server.%d{yyyy-MM-dd}.%i.log.gz}
      max-file-size: ${KROSS_LOG_MAX_FILE_SIZE:50MB}
      max-history: ${KROSS_LOG_MAX_HISTORY:14}
      total-size-cap: ${KROSS_LOG_TOTAL_SIZE_CAP:1GB}
      clean-history-on-start: false

kross:
  dev-identity-enabled: ${KROSS_DEV_IDENTITY:false}
  public-base-url: ${KROSS_PUBLIC_BASE_URL:http://127.0.0.1:8787}
  external-base-url: ${KROSS_EXTERNAL_BASE_URL:http://127.0.0.1:8787}
  credential-master-key: ${KROSS_CREDENTIAL_MASTER_KEY:}
  scheduler-owner: ${KROSS_SCHEDULER_OWNER:kross-server}
  worker-image: ${KROSS_WORKER_IMAGE:kross-worker:local}
  orchestrator-manager-id: ${KROSS_ORCHESTRATOR_MANAGER_ID:kross-saas}
  control-plane-container: ${KROSS_CONTROL_PLANE_CONTAINER:}
  object-store-container: ${KROSS_S3_CONTAINER:}
  agent-network: ${KROSS_AGENT_NETWORK:}
  worker-runtime: ${KROSS_WORKER_RUNTIME:local}
  worker-storage: ${KROSS_WORKER_STORAGE:local}
  juicefs-mount: ${KROSS_JUICEFS_MOUNT:}
  node-token: ${KROSS_NODE_TOKEN:}
  node-id: ${KROSS_NODE_ID:node-1}
  node-tokens: ${KROSS_NODE_TOKENS:}
  api:
    prefix: ${KROSS_API_PREFIX:/api/v2}
  scheduler:
    poll-ms: ${KROSS_SCHEDULER_POLL_MS:5000}
  agent:
    idle-ms: ${KROSS_AGENT_IDLE_MS:900000}
    token-ttl-ms: ${KROSS_AGENT_TOKEN_TTL_MS:43200000}
    heartbeat-interval-ms: ${KROSS_AGENT_HEARTBEAT_INTERVAL_MS:10000}
    job-lease-ms: ${KROSS_AGENT_JOB_LEASE_MS:90000}
    job-max-attempts: ${KROSS_AGENT_JOB_MAX_ATTEMPTS:2}
    start-timeout-ms: ${KROSS_AGENT_START_TIMEOUT_MS:120000}
    cpu-millis: ${KROSS_AGENT_CPU_MILLIS:2000}
    memory-bytes: ${KROSS_AGENT_MEMORY_BYTES:1073741824}
    max-pids: ${KROSS_AGENT_MAX_PIDS:512}
  s3:
    endpoint: ${KROSS_S3_ENDPOINT:http://127.0.0.1:9000}
    public-endpoint: ${KROSS_S3_PUBLIC_ENDPOINT:http://127.0.0.1:9000}
    region: ${KROSS_S3_REGION:us-east-1}
    bucket: ${KROSS_S3_BUCKET:kross}
    access-key: ${KROSS_S3_ACCESS_KEY:kross}
    secret-key: ${KROSS_S3_SECRET_KEY:kross-minio-secret}
    path-style: true
    presign-ttl: PT15M
