# Cluster control plane: Java only schedules. JuiceFS + kross-node start Worker
# containers via the host Docker socket.
#
#   export KROSS_PUBLIC_BASE_URL=http://控制面局域网IP:8788
#   export KROSS_NODE_TOKEN=...   # node-1 的令牌；start-cloud.sh 会生成
#   docker compose -f docker-compose.yml -f docker-compose.juicefs.yml -f docker-compose.cluster.yml up -d
#
# Extra worker machines use docker-compose.node.yml, not this file.
# Users hit Nginx on 8787. Worker / kross-node use the control plane directly:
# same Compose network -> http://kross-server:8787 ; other hosts -> host port 8788.
# 8788 defaults to 127.0.0.1. Set KROSS_INTERNAL_BIND to a LAN address for extra nodes.
# Do not publish 8788 to the internet.

services:
  server:
    ports:
      - "${KROSS_INTERNAL_BIND:-127.0.0.1}:${KROSS_INTERNAL_PORT:-8788}:8787"
    environment:
      KROSS_WORKER_RUNTIME: cluster
      KROSS_WORKER_STORAGE: juicefs
      KROSS_NODE_TOKEN: ${KROSS_NODE_TOKEN:?请设置 KROSS_NODE_TOKEN}
      KROSS_NODE_ID: ${KROSS_NODE_ID:-node-1}
      KROSS_NODE_TOKENS: ${KROSS_NODE_TOKENS:-}
      KROSS_JUICEFS_MOUNT: ${KROSS_JUICEFS_MOUNT:-/var/lib/kross/jfs}
      KROSS_PUBLIC_BASE_URL: ${KROSS_PUBLIC_BASE_URL:?集群请设为节点和 Worker 都能访问的控制面地址，例如 http://10.0.0.10:8788}

  kross-node:
    image: kross-node:local
    build:
      context: .
      dockerfile: docker/node.Dockerfile
    environment:
      KROSS_CONTROL_PLANE_URL: ${KROSS_CONTROL_PLANE_URL:-http://kross-server:8787}
      KROSS_NODE_TOKEN: ${KROSS_NODE_TOKEN:?请设置 KROSS_NODE_TOKEN}
      KROSS_NODE_ID: ${KROSS_NODE_ID:-node-1}
      KROSS_WORKER_STORAGE: juicefs
      KROSS_JUICEFS_MOUNT: ${KROSS_JUICEFS_MOUNT:-/var/lib/kross/jfs}
      KROSS_WORKER_IMAGE: kross-worker:local
      KROSS_ORCHESTRATOR_MANAGER_ID: ${KROSS_ORCHESTRATOR_MANAGER_ID:-kross-saas}
    volumes:
      # JuiceFS is bind-mounted into Worker containers at start time via the
      # Docker socket. Do not mount it here: a long-lived bind goes stale when
      # the JuiceFS container is recreated.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      juicefs:
        condition: service_healthy
      server:
        condition: service_healthy
      worker-image:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [kross-control]
    restart: unless-stopped
